apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: ollama

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      containers:
      - name: ollama

        image: ollama/ollama:latest

        ports:
        - containerPort: 11434

        env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434

        resources:
          requests:
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1

        livenessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30

        readinessProbe:
          httpGet:
            path: /
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 15

        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama

      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models