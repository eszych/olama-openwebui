apiVersion: apps/v1
kind: Deployment

metadata:
  name: openwebui
  namespace: ollama

spec:
  replicas: 1

  selector:
    matchLabels:
      app: openwebui

  template:
    metadata:
      labels:
        app: openwebui

    spec:
      containers:
      - name: openwebui

        image: ghcr.io/open-webui/open-webui:main

        ports:
        - containerPort: 8080

        env:
        - name: OLLAMA_BASE_URL
          value: http://ollama:11434
          
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15

        volumeMounts:
        - name: openwebui-data
          mountPath: /app/backend/data

      volumes:
      - name: openwebui-data
        persistentVolumeClaim:
          claimName: openwebui-data